<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salesforce Dev Sheet - Apex, LWC, Aura</title>
<meta name="description" content="Striver-style coding practice sheet for Salesforce Apex, LWC and Aura with described problems, difficulty levels and progress tracking.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="title">
      <h1>Salesforce Dev Sheet</h1>
      <p>Coding problems for Apex &bull; LWC &bull; Aura, by topic and difficulty</p>
    </div>
    <div class="actions">
      <button id="themeBtn" title="Toggle theme">Theme</button>
      <button id="exportBtn">Export</button>
      <button id="importBtn">Import</button>
      <button id="resetBtn" class="danger">Reset</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </div>
</header>

<main class="wrap">
  <nav class="modes" id="modes"></nav>

  <section class="stats" id="stats"></section>

  <nav class="tabs" id="tabs"></nav>

  <section class="filters">
    <input id="search" type="search" placeholder="Search problems...">
    <select id="fDiff">
      <option value="">All difficulty</option>
      <option value="E">Easy</option>
      <option value="M">Medium</option>
      <option value="H">Hard</option>
    </select>
    <select id="fType">
      <option value="">All types</option>
      <option value="C">Concept</option>
      <option value="K">Coding</option>
      <option value="S">Scenario</option>
    </select>
    <select id="fStatus">
      <option value="">All status</option>
      <option value="todo">Not done</option>
      <option value="done">Done</option>
      <option value="star">Revise (starred)</option>
    </select>
  </section>

  <section id="list"></section>
</main>

<footer class="wrap foot">
  Progress is saved in your browser (localStorage). Use Export to back it up or move it to another device.
</footer>

<script src="questions.js"></script>
<script src="problems_apex.js"></script>
<script src="problems_lwc_aura.js"></script>
<script src="app.js"></script>
</body>
</html>
